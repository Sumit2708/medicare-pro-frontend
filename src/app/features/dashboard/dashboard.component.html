<app-page-header
  title="Dashboard"
  subtitle="Clinic Overview"
  [showButton]="false">
</app-page-header>

@if (dashboard$ | async; as dashboard) {

  <app-summary-cards
    [dashboard]="dashboard">
  </app-summary-cards>

  <div class="dashboard-layout">

    <!-- Monthly Revenue -->
    <app-chart-card
      title="Monthly Revenue"
      subtitle="Last 12 Months"
      icon="trending_up">

      <app-revenue-chart
        [data]="dashboard.monthlyRevenue ?? []">
      </app-revenue-chart>

    </app-chart-card>


    <!-- Payment Status -->
    <app-chart-card
      title="Payment Status"
      subtitle="Payment Summary"
      icon="receipt">

      <app-payment-chart
        [data]="dashboard.paymentSummary ?? []">
      </app-payment-chart>

    </app-chart-card>


    <!-- Monthly Appointments -->
    <app-chart-card
      title="Monthly Appointments"
      subtitle="Last 12 Months"
      icon="bar_chart"
      class="full-width">

      <app-appointments-chart
        [data]="dashboard.monthlyAppointments ?? []">
      </app-appointments-chart>

    </app-chart-card>


    <!-- Recent Appointments -->
    <app-chart-card
      title="Recent Appointments"
      subtitle="Latest 5 appointments"
      icon="schedule">

      <app-recent-appointments
        [appointments]="dashboard.recentAppointments ?? []">
      </app-recent-appointments>

    </app-chart-card>


    <!-- Pending Payments -->
    <app-chart-card
      title="Pending Payments"
      subtitle="Outstanding invoices"
      icon="payment">

      <app-pending-payments
        [invoices]="dashboard.pendingInvoices">
      </app-pending-payments>

    </app-chart-card>

  </div>

}
