<div class="cred-dialog">
  <div class="cred-header">
    <div class="cred-icon">
      <mat-icon>verified_user</mat-icon>
    </div>
    <div>
      <h2>Doctor Account Created</h2>
      <p class="cred-sub">Share these credentials with {{ data.doctorName }}</p>
    </div>
  </div>

  <div class="cred-field">
    <span class="cred-label">Email</span>
    <div class="cred-value-row">
      <span class="cred-value">{{ data.email }}</span>
      <button mat-icon-button (click)="copy(data.email, 'Email')">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>
  </div>

  <div class="cred-field">
    <span class="cred-label">Temporary Password</span>
    <div class="cred-value-row">
      <span class="cred-value">{{ data.password }}</span>
      <button mat-icon-button (click)="copy(data.password, 'Password')">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>
  </div>

  <div class="cred-warning">
    <mat-icon>info</mat-icon>
    <span>This password won't be shown again. The doctor should change it after first login.</span>
  </div>

  <button mat-raised-button color="primary" class="cred-close-btn" (click)="close()">
    Done
  </button>
</div>
