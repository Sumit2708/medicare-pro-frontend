<app-page-header title="Revenue Report" subtitle="Revenue Analytics">
</app-page-header>

<app-report-filter (generate)="generateReport($event)"> </app-report-filter>

<div #reportContent class="report-content">
  @if (summary) {
    <div class="summary-grid">
      <app-report-summary-card
        title="Total Revenue"
        [value]="summary.totalRevenue | currency: 'INR'"
        icon="payments"
        color="#2E7D32"
      >
      </app-report-summary-card>

      <app-report-summary-card
        title="Invoices"
        [value]="summary.totalInvoices"
        icon="receipt_long"
        color="#1976D2"
      >
      </app-report-summary-card>

      <app-report-summary-card
        title="Average Invoice"
        [value]="summary.averageInvoice | currency: 'INR'"
        icon="analytics"
        color="#FB8C00"
      >
      </app-report-summary-card>

      <app-report-summary-card
        title="GST"
        [value]="summary.totalGST | currency: 'INR'"
        icon="account_balance"
        color="#8E24AA"
      >
      </app-report-summary-card>
    </div>
  }

  <table mat-table [dataSource]="invoices" class="revenue-table">
    <!-- Invoice -->

    <ng-container matColumnDef="invoice">
      <th mat-header-cell *matHeaderCellDef>Invoice</th>

      <td mat-cell *matCellDef="let row">
        {{ row.invoiceNumber }}
      </td>
    </ng-container>

    <!-- Patient -->

    <ng-container matColumnDef="patient">
      <th mat-header-cell *matHeaderCellDef>Patient</th>

      <td mat-cell *matCellDef="let row">
        {{ row.patientName }}
      </td>
    </ng-container>

    <!-- Doctor -->

    <ng-container matColumnDef="doctor">
      <th mat-header-cell *matHeaderCellDef>Doctor</th>

      <td mat-cell *matCellDef="let row">
        {{ row.doctorName }}
      </td>
    </ng-container>

    <!-- Date -->

    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>

      <td mat-cell *matCellDef="let row">
        {{ row.invoiceDate | date: "dd MMM yyyy" }}
      </td>
    </ng-container>

    <!-- Status -->

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>

      <td mat-cell *matCellDef="let row">
        {{ row.paymentStatus }}
      </td>
    </ng-container>

    <!-- Amount -->

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Amount</th>

      <td mat-cell *matCellDef="let row">
        {{ row.total | currency: "INR" }}
      </td>
    </ng-container>

    <!-- Header -->

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Rows -->

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<app-report-export-actions
  (exportPdf)="exportPdf()"
  (exportExcel)="exportExcel()"
  (print)="printReport()"
>
</app-report-export-actions>
