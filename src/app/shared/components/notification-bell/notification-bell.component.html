<button mat-icon-button class="bell-trigger" [matMenuTriggerFor]="notifMenu">
  <mat-icon>notifications_none</mat-icon>
  @if ((unreadCount$ | async); as count) {
    @if (count > 0) {
      <span class="bell-badge">{{ count > 9 ? '9+' : count }}</span>
    }
  }
</button>

<mat-menu #notifMenu="matMenu" xPosition="before" class="notif-menu">
  <div class="notif-panel">
    <div class="notif-header">
      <h4>Notifications</h4>
      <button class="mark-all-btn" (click)="markAllAsRead()">Mark all read</button>
    </div>

    <div class="notif-list">
      @for (n of (notifications$ | async); track n.id) {
        <div class="notif-item" [class.unread]="!n.read" (click)="markAsRead(n)">
          <div class="notif-icon" [ngClass]="n.type">
            <mat-icon>{{ n.icon }}</mat-icon>
          </div>
          <div class="notif-text">
            <span class="notif-title">{{ n.title }}</span>
            <span class="notif-message">{{ n.message }}</span>
            <span class="notif-time">{{ timeAgo(n.timestamp) }}</span>
          </div>
          @if (!n.read) {
            <span class="unread-dot"></span>
          }
        </div>
      }

      @if ((notifications$ | async)?.length === 0) {
        <div class="notif-empty">
          <mat-icon>notifications_none</mat-icon>
          <p>You're all caught up!</p>
        </div>
      }
    </div>
  </div>
</mat-menu>
