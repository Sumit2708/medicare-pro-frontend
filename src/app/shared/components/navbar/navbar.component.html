<mat-toolbar class="app-navbar">
 <button
  type="button"
  class="menu-toggle"
  [class.is-open]="sidebarService.isOpen()"
  (click)="onMenuToggle()"
  aria-label="Toggle navigation menu"
>
  <span class="menu-toggle-bar"></span>
  <span class="menu-toggle-bar"></span>
  <span class="menu-toggle-bar"></span>
</button>

  <div class="brand">
    <span class="brand-mark">
      <mat-icon>local_hospital</mat-icon>
    </span>
    <div class="brand-text">
      <span class="brand-name">{{clinic_info.name}}</span>
      <span class="brand-tagline">{{clinic_info.tagline}}</span>
    </div>
  </div>

  <span class="spacer"></span>

  <div class="nav-actions">
    <!-- Desktop search -->
    <div class="search-wrap" [class.open]="searchOpen">
      <button
        type="button"
        class="action-btn"
        mat-icon-button
        (click)="toggleSearch()"
      >
        <mat-icon>search</mat-icon>
      </button>
      <input
        #searchInput
        class="search-input"
        type="text"
        name="navbar-search-desktop"
        autocomplete="off"
        spellcheck="false"
        placeholder="Search patients, appointments..."
        [(ngModel)]="searchTerm"
        (input)="onSearchInput(searchTerm)"
        (keydown.escape)="closeSearch()"
        (blur)="onSearchBlur()"
      />
      <div
        class="search-results"
        *ngIf="searchOpen && searchTerm.length > 0"
        (mousedown)="$event.preventDefault()"
      >
        <ng-container *ngIf="groupedResults.length; else noResults">
          <div class="result-group" *ngFor="let group of groupedResults">
            <span class="group-label">{{ group.label }}</span>
            <button
              type="button"
              class="result-row"
              *ngFor="let item of group.items"
              (click)="goToResult(item)"
            >
              <span
                class="chip"
                [style.background]="item.chipBg"
                [style.color]="item.chipColor"
                >{{ item.initials }}</span
              >
              <span class="result-name">{{ item.name }}</span>
              <span class="result-meta">{{ item.meta }}</span>
            </button>
          </div>
        </ng-container>
        <ng-template #noResults>
          <div class="no-results">No matches for "{{ searchTerm }}"</div>
        </ng-template>
      </div>
    </div>

    <!-- Mobile search trigger -->
    <button
      type="button"
      class="action-btn mobile-search-btn"
      mat-icon-button
      (click)="toggleSearch()"
    >
      <mat-icon>search</mat-icon>
    </button>

    <app-notification-bell></app-notification-bell>

    <span class="nav-divider"></span>

    <div
      class="profile-trigger"
      role="button"
      tabindex="0"
      [matMenuTriggerFor]="profileMenu"
    >
      <span class="avatar">{{ getInitials(currentUser?.name) }}</span>
      <span class="profile-meta">
        <span class="profile-name">{{ currentUser?.name }}</span>
        <span class="profile-role">{{ currentUser?.role }}</span>
      </span>
      <mat-icon class="chevron">expand_more</mat-icon>
    </div>
  </div>

  <mat-menu #profileMenu="matMenu" xPosition="before" class="profile-menu">
    <button type="button" mat-menu-item (click)="navProfile()">
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <button type="button" mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>

<!-- Mobile search overlay -->
<div class="mobile-search-overlay" [class.open]="searchOpen">
  <div class="mobile-search-bar">
    <mat-icon>search</mat-icon>
    <input
      #mobileSearchInput
      type="text"
      name="navbar-search-mobile"
      autocomplete="off"
      spellcheck="false"
      placeholder="Search patients, appointments..."
      [(ngModel)]="searchTerm"
      (input)="onSearchInput(searchTerm)"
      (keydown.escape)="closeSearch()"
    />
    <button type="button" mat-icon-button (click)="closeSearch()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="search-results" *ngIf="searchTerm.length > 0">
    <ng-container *ngIf="groupedResults.length; else noResultsMobile">
      <div class="result-group" *ngFor="let group of groupedResults">
        <span class="group-label">{{ group.label }}</span>
        <button
          type="button"
          class="result-row"
          *ngFor="let item of group.items"
          (click)="goToResult(item)"
        >
          <span
            class="chip"
            [style.background]="item.chipBg"
            [style.color]="item.chipColor"
            >{{ item.initials }}</span
          >
          <span class="result-name">{{ item.name }}</span>
          <span class="result-meta">{{ item.meta }}</span>
        </button>
      </div>
    </ng-container>
    <ng-template #noResultsMobile>
      <div class="no-results">No matches for "{{ searchTerm }}"</div>
    </ng-template>
  </div>
</div>
