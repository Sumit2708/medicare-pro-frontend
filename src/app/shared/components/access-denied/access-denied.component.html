<div class="access-denied-container">
  <div class="content">
    <div class="icon-ring">
      <mat-icon class="error-icon">block</mat-icon>
    </div>

    <span class="error-code">403</span>

    <h2>Access Denied</h2>
    <p>You don't have permission to view this page. If you think this is a mistake, contact your administrator.</p>

    <div class="actions">
      <button mat-raised-button color="primary" routerLink="/doctor-dashboard">
        <mat-icon>dashboard</mat-icon>
        Go To Dashboard
      </button>
      <button mat-stroked-button (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
        Go Back
      </button>
    </div>
  </div>
</div>
