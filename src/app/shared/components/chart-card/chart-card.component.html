<mat-card class="chart-card">

  <mat-card-header>

    <div class="header">

      <div class="left">

        @if(icon){

          <mat-icon>{{ icon }}</mat-icon>

        }

        <div>

          <h3>{{ title }}</h3>

          @if(subtitle){

            <p>{{ subtitle }}</p>

          }

        </div>

      </div>

      <div class="right">

        <ng-content select="[actions]"></ng-content>

      </div>

    </div>

  </mat-card-header>

  <mat-card-content>

    <ng-content></ng-content>

  </mat-card-content>

<!-- </mat-card> -->
