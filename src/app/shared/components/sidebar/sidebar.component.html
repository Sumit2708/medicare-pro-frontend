<div class="sidebar">
  <div class="logo">
    <span class="logo-mark"><mat-icon>local_hospital</mat-icon></span>
    <span class="logo-text">MediCare <b>Pro</b></span>
  </div>

  <nav class="nav-list">
    @for (item of visibleMenuItems; track item.route) {
      <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
